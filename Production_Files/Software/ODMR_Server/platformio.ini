; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP32-S3: Arduino core 3 (pioarduino), USB in TinyUSB mode so one cable
; carries USB serial and a USB network (iPad/iPhone: http://192.168.7.1, see
; src/usb_net.cpp). Uploads restart the board into download mode over USB
; serial, no button needed.
[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.partitions = custom_partition_esp32s3.csv
board_build.filesystem = spiffs
board_upload.flash_size = 4MB
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_unflags = -std=gnu++11 -DARDUINO_USB_MODE=1
build_flags = -DESP32S3 -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	bblanchon/ArduinoJson@^7.3.1
	adafruit/Adafruit TSL2591 Library@^1.4.5
	adafruit/Adafruit NeoPixel@^1.12.5
	esp32async/AsyncTCP@^3.4.10
	esp32async/ESPAsyncWebServer@^3.11.2
extra_scripts =
  pre:scripts/gzip_assets.py
  post:scripts/merge_espwebtools.py


[env:seeed_xiao_esp32c3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.partitions = custom_partition_esp32c3.csv
board_build.filesystem = spiffs
board_upload.flash_size = 4MB
build_unflags = -std=gnu++11
build_flags = -DESP32C3 
  -DCONFIG_TINYUSB_CDC_ENABLED=y
  -DCONFIG_TINYUSB_CDC_RX_BUFSIZE=1024
  -DCONFIG_TINYUSB_CDC_TX_BUFSIZE=1024 
lib_deps =
	bblanchon/ArduinoJson@^7.3.1
	adafruit/Adafruit TSL2591 Library@^1.4.5
	adafruit/Adafruit NeoPixel@^1.12.5
	esp32async/AsyncTCP@^3.4.10
	esp32async/ESPAsyncWebServer@^3.11.2
	; rf synthesizer library, possibly self-written, local folder
	ADF4351 = symlink://${PROJECT_DIR}/lib/ADF4351
extra_scripts =
  pre:scripts/gzip_assets.py
  post:scripts/merge_espwebtools.py
