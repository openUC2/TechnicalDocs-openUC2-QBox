; ESP32-S3 with USB serial and a USB network adapter. See README.md.
; ESP-IDF, not Arduino: only esp_tinyusb has the USB network class.

[platformio]
default_envs = serial_network

[env]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = espidf
board_build.embed_txtfiles = src/index.html

; USB serial + network. Uploads go through the running firmware, no button needed.
[env:serial_network]
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; The same firmware, uploaded in the 10 s after plugging in, when the above fails.
[env:rescue]

; USB network only, to tell apart problems of the network from those of the combination.
; Upload it in the 10 s after plugging in, like rescue.
[env:network_only]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;network_only.defaults"
