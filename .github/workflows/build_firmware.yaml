# Build the ODMR firmware (XIAO ESP32-S3 / ESP32-C3) and publish it to
# youseetoo.github.io:
#   static/firmware_build/odmr-xiao-<chip>.bin + -manifest.json
#       read by the web flasher (https://youseetoo.github.io, js/flasher/config.js)
#   odmr/   the WebSerial app (https://youseetoo.github.io/odmr)
#
# Each image is bootloader + partitions + app + SPIFFS (the board's own web
# pages), merged at 0x0 by scripts/merge_espwebtools.py — the same image
# `pio run -t mergedbin` gives you locally.
#
# Pull requests only build; pushes to main also publish.

name: Build ODMR Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Production_Files/Software/ODMR_Server/**'
      - '.github/workflows/build_firmware.yaml'
  pull_request:
    paths:
      - 'Production_Files/Software/ODMR_Server/**'
      - '.github/workflows/build_firmware.yaml'

env:
  PROJECT_DIR: Production_Files/Software/ODMR_Server
  WEB_REPO: youseetoo/youseetoo.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env_name: seeed_xiao_esp32s3
            board_id: odmr-xiao-esp32s3
            chip_family: ESP32-S3
            display_name: ODMR Xiao ESP32S3
          - env_name: seeed_xiao_esp32c3
            board_id: odmr-xiao-esp32c3
            chip_family: ESP32-C3
            display_name: ODMR Xiao ESP32C3
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the version in the manifest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      # App, then SPIFFS (data/, gzipped from src/website_html by
      # scripts/gzip_assets.py), then the merged image in build/fw-images/.
      - name: Build firmware, filesystem and merged image
        run: |
          pio run -e ${{ matrix.env_name }}
          pio run -e ${{ matrix.env_name }} -t buildfs
          pio run -e ${{ matrix.env_name }} -t mergedbin

      - name: Name image and write ESP Web Tools manifest
        run: |
          mkdir -p out
          cp build/fw-images/${{ matrix.env_name }}.bin out/${{ matrix.board_id }}.bin
          VERSION=$(git describe --tags --always)
          cat > out/${{ matrix.board_id }}-manifest.json <<EOF
          {
            "name": "${{ matrix.display_name }}",
            "version": "$VERSION",
            "funding_url": "https://github.com/${{ github.repository }}",
            "builds": [
              {
                "chipFamily": "${{ matrix.chip_family }}",
                "parts": [{ "path": "${{ matrix.board_id }}.bin", "offset": 0 }]
              }
            ]
          }
          EOF
          cat out/${{ matrix.board_id }}-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: odmr-${{ matrix.board_id }}
          path: ${{ env.PROJECT_DIR }}/out/

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/download-artifact@v4
        with:
          path: fw
          pattern: odmr-*
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_REPO }}
          path: dest
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Copy firmware and WebSerial app, commit
        run: |
          set -eu
          ls -la fw
          # firmware_build is what the flasher reads; firmware_odmr keeps old links working
          mkdir -p dest/static/firmware_build dest/static/firmware_odmr
          cp fw/* dest/static/firmware_build/
          cp fw/* dest/static/firmware_odmr/
          rm -rf dest/odmr
          cp -R "src/${PROJECT_DIR}/webserial-app" dest/odmr

          cd dest
          git config user.email 'bene.d@gmx.de'
          git config user.name 'beniroquai'
          git add -A static/firmware_build static/firmware_odmr odmr
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "ODMR firmware and WebSerial app from ${{ github.repository }}@${GITHUB_SHA::7}"
          git push
